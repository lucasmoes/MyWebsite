<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1584, initial-scale=1.0">
  <title>LinkedIn Banner</title>
  <link rel="stylesheet" href="../styles.css">

  <style>


    html,
    body {
      width: 1584px;
      height: 396px;
      min-height: 396px;
      overflow: hidden;
      scroll-behavior: auto;
    }


    .blob {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1150px;
      height: 1150px;
      transform: translate(-50%, -50%);
      z-index: 0;
    }

    .banner-page {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 320px;
    }

    .banner-logo {
      width: 250px;
      height: auto;
      display: block;
      filter: brightness(0) invert(1) drop-shadow(0 18px 42px rgba(96, 165, 250, 0.22));
    }
  </style>
</head>
<body>
<div class="blob" aria-hidden="true"></div>

<main class="banner-page" aria-label="LinkedIn banner">
  <div class="banner-logo-wrap">
    <img class="banner-logo" src="../assets/lmlogo.svg" alt="Lucas Moes logo">
  </div>
</main>
</body>
</html>
